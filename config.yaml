# serial: YOUR_SERIAL          # only needed if more than one adb device is attached

# Turn the screen off (locks the phone) at the end of every command except status.
lock_screen_when_done: true

# Never removed or replaced by any command (CLI, TUI or SSH).
protected_devices: ["Test"]

# Chats offered as quick picks for "last message" in the TUI (a helper; any chat can be read).
quick_chats: []                # e.g. ["PayPal"]

# Human-like input timing in ms, [min, max], drawn from a normal distribution.
timing:
  same_type_ms: [70, 200]      # char->char, digit->digit
  switch_type_ms: [130, 320]   # letter<->digit
  click_ms: [300, 650]         # layout taps

# SSH forced command (walink_remote.py) and notifications.
remote:
  timeout_s: 240               # a one-shot SSH command is stopped (and the phone reset) after this
  # notify_cmd: "ntfy publish walink"   # optional; gets a one-line message on stdin (never message content)
